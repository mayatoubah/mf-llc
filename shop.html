<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shop | Maci Food</title><link rel="stylesheet" href="css/styles.css"></head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html">Maci <span>Food</span></a><nav class="nav-links"><a href="shop.html">Shop</a></nav><div class="nav-actions"><button class="icon-btn" data-open-search>⌕</button><button class="icon-btn" data-theme-toggle>◐</button><button class="icon-btn badge" data-open-cart data-cart-count data-count="0">🛒</button></div></div></header>
<main class="container section"><h1>Shop</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:1rem"><select id="fCat"><option value="">Catégorie</option></select><select id="fOrigin"><option value="">Origine</option></select><input id="fMin" type="number" placeholder="Prix min"><input id="fMax" type="number" placeholder="Prix max"><label><input id="fPromo" type="checkbox"> Promo</label><label><input id="fStock" type="checkbox"> En stock</label><select id="sortBy"><option value="popular">Popularité</option><option value="new">Nouveau</option><option value="price-asc">Prix ↑</option><option value="price-desc">Prix ↓</option></select></div><div id="shopGrid" class="grid product-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></main>
<footer class="footer"><div class="container">© Maci Food</div></footer>
<div id="cartDrawer" class="drawer"><div class="overlay" data-close-layer></div><aside class="panel"><h3>Panier</h3><div id="drawerItems"></div><p>Total: <strong id="drawerTotal"></strong></p><a href="cart.html" class="btn btn-primary">Checkout</a></aside></div><div id="quickView" class="modal"><div class="overlay" data-close-layer></div><div class="modal-card"><button class="btn btn-ghost" data-close-layer>Fermer</button><div id="quickViewBody"></div></div></div><div id="searchModal" class="search-overlay"><div class="overlay" data-close-layer></div><div class="modal-card"><input id="searchInput"><div id="searchResults"></div></div></div><div id="toastWrap" class="toast-wrap"></div>
<script type="module" src="js/pages/shop.js"></script></body></html>
