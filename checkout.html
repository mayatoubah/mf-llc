<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Maci Food</title><link rel="stylesheet" href="css/styles.css"></head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="index.html">Maci <span>Food</span></a></div></header>
<main class="container section"><h1>Checkout (UI)</h1><form id="checkoutForm" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem"><section class="card"><h3>Adresse</h3><input required placeholder="Nom complet"><input required placeholder="Adresse"><input required placeholder="Ville"><input required placeholder="Code postal"></section><section class="card"><h3>Livraison</h3><label><input type="radio" name="ship" checked> Standard 48h</label><label><input type="radio" name="ship"> Express 24h</label><h3>Paiement (UI)</h3><input placeholder="Numéro carte"><input placeholder="MM/AA"><input placeholder="CVC"></section><section class="card"><h3>Confirmer</h3><p>Aucun paiement réel n'est effectué.</p><button class="btn btn-primary">Confirmer</button><p id="confirmation" hidden>✅ Commande simulée confirmée !</p></section></form></main>
<footer class="footer"><div class="container">© Maci Food</div></footer>
<div id="cartDrawer" class="drawer"><div class="overlay" data-close-layer></div><aside class="panel"><h3>Panier</h3><div id="drawerItems"></div><p>Total: <strong id="drawerTotal"></strong></p></aside></div><div id="quickView" class="modal"><div class="overlay" data-close-layer></div><div class="modal-card"><button class="btn btn-ghost" data-close-layer>Fermer</button><div id="quickViewBody"></div></div></div><div id="searchModal" class="search-overlay"><div class="overlay" data-close-layer></div><div class="modal-card"><input id="searchInput"><div id="searchResults"></div></div></div><div id="toastWrap" class="toast-wrap"></div>
<script type="module" src="js/pages/checkout.js"></script></body></html>
